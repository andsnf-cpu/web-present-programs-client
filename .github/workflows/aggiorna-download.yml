# Ogni 10 minuti copia sul sito l'ultimo installer di ogni programma (strumenti/aggiorna-download.js): quando esce
# una nuova versione, i pulsanti "Scarica" la danno da soli. Serve il secret RELEASES_TOKEN, lo stesso token di sola
# lettura delle release che usa PRO Launcher; senza, non fa niente.
name: Aggiorna i download

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-download

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Manca il token
        if: env.RELEASES_TOKEN == ''
        run: echo "::notice::Aggiungi il secret RELEASES_TOKEN (Settings › Secrets and variables › Actions) per aggiornare i download da soli."
      - uses: actions/checkout@v4
        if: env.RELEASES_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.RELEASES_TOKEN != ''
        with:
          node-version: 22
      - name: Copia gli installer nuovi
        if: env.RELEASES_TOKEN != ''
        run: node strumenti/aggiorna-download.js
